</style><body><div class="app">
<header class="top"><div class="brand">P E R S O N A L&nbsp; E X P E N S E&nbsp; B O O K</div><nav class="modebar"><button class="modebtn active" id="ledgerTab">账单</button><button class="modebtn" id="rankTab">排行</button><button class="modebtn" id="themeToggle">☾ 夜间模式</button></nav></header>

<main class="ledgerModeView open" id="ledgerMain"><section class="paper manual"><div class="kicker">PERSONAL RECORD / 手动记账</div><h2>记下一笔消费</h2><div class="manualGrid"><label>消费类别<div class="categoryPick"><select id="mCategory"></select><button type="button" class="btn" id="manageCats">管理类别</button></div></label><label>消费项目<input id="mItem" placeholder="午餐、咖啡…"></label><label>金额（元）<input id="mAmount" type="number" min=".01" step=".01" placeholder="0.00"></label><label>消费时间<button class="btn dateTrigger" id="dateTrigger" type="button">选择日期和时间</button></label></div><button class="btn main" id="mAdd">＋ 添加消费记录</button><div class="error" id="mError"></div></section><section class="paper dashboard"><div class="dashHead"><h2 id="pageTitle">账单</h2><div class="dashTools"><button class="btn" id="newBook">＋ 新建账单</button><button class="btn" id="renameBook">重命名</button><button class="btn" id="mJson">导出 JSON</button><button class="btn" id="mCsv">导出 CSV</button><button class="btn" id="mImport">导入账单</button><input id="mFile" type="file" accept=".json,.csv" hidden><select id="bookSelect"></select><select id="mPeriod"><option value="all">全部时间</option><option value="day">每天</option><option value="week">每周</option><option value="month">每月</option><option value="year">每年</option></select><select id="mPeriodKey"></select></div></div><div id="billPage" class="pageBody"><div class="stats"><div class="stat"><small>总消费</small><strong id="mTotal">¥0.00</strong></div><div class="stat"><small>消费类别</small><strong id="mCatCount">0 类</strong></div><div class="stat"><small>消费笔数</small><strong id="mCount">0 笔</strong></div></div><div class="analytics"><div class="chart"><b>各类别消费金额</b><div id="mBars" class="bars"></div></div><div class="chart"><b>账单说明</b><p class="muted" id="bookMeta">每个账单独立保存，可导入、切换和重命名。</p></div></div><div class="recordHead"><b>消费明细</b><select id="mSort"><option value="date">时间：新到旧</option><option value="old">时间：旧到新</option><option value="high">金额：高到低</option><option value="low">金额：低到高</option><option value="cat">类别</option><option value="item">名称</option></select></div><div class="recordList" id="mRecords"></div></div><div id="rankPage" class="pageBody" hidden><div class="rankToolbar"><b>消费排行</b><button class="btn" id="rankType">按金额排行　⌄</button><select id="rankSort"><option value="desc">从高到低</option><option value="asc">从低到高</option></select></div><div id="rankContent" class="rankContent"></div></div><div class="ledgerFooter"><span>消费类别 <strong id="mCatCountFoot">0 类</strong></span><span>总消费 <strong id="mTotalFoot">¥0.00</strong></span><small id="mCountFoot">0 笔消费</small></div></section></main><div id="categoryModal" class="appModal"><div class="modalPanel"><div class="modalHead"><b>管理消费类别</b><button id="closeCats">×</button></div><p>“未分类”是系统类别，不能删除。未指定类别的消费会自动归入这里。</p><div class="modalAdd"><input id="newCategory" placeholder="输入新类别名称"><button class="btn main" id="addCategory">添加</button></div><div id="categoryList" class="categoryList"></div></div></div><div id="confirmModal" class="appModal"><div class="modalPanel"><div class="modalHead"><b id="confirmTitle">确认操作</b><button id="cancelDeleteX">×</button></div><p id="confirmText"></p><div class="modalActions"><button class="btn" id="cancelDelete">取消</button><button class="btn red" id="confirmDelete">确定</button></div></div></div><div id="dateModal" class="appModal"><div class="modalPanel"><div class="modalHead"><b>选择消费时间</b><button id="closeDate">×</button></div><div class="calendarHead"><button class="btn" id="prevMonth">‹</button><b id="calendarLabel"></b><button class="btn" id="nextMonth">›</button></div><div class="calendarGrid" id="calendarGrid"></div><div class="timePick"><label>小时<select id="dateHour"></select></label><label>分钟<select id="dateMinute"></select></label></div><div class="modalActions"><button class="btn" id="dateCancel">取消</button><button class="btn main" id="dateConfirm">确定</button></div></div></div><div id="importModal" class="appModal"><div class="modalPanel"><div class="modalHead"><b>导入账单</b><button id="closeImport">×</button></div><p id="importSummary"></p><label>账单名称<input id="importName" placeholder="给导入的账单命名"></label><div class="modalActions"><button class="btn" id="importReplace">替换当前账单</button><button class="btn main" id="importNew">作为新账单打开</button></div></div></div><div id="itemCategoryModal" class="appModal"><div class="modalPanel"><div class="modalHead"><b>修改消费类别</b><button id="closeItemCategory">×</button></div><p>选择这条消费记录的新类别。</p><div id="itemCategoryChoices" class="categoryList"></div></div></div><div id="rankTypeModal" class="appModal"><div class="modalPanel"><div class="modalHead"><b>选择排行类别</b><button id="closeRankType">×</button></div><div class="categoryList"><button class="custom-select-option" data-rank="amount">按消费金额排行</button><button class="custom-select-option" data-rank="count">按消费次数排行</button></div></div></div></div><script>(()=> {
const $=id=>document.getElementById(id), money=n=>'¥'+(n/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}), cents=v=>Math.round(Number(v)*100), fmt=money;
const STORE='my-expense-books-v2',CAT='my-expense-categories-v1',LEGACY='my-expense-records-v1';
let books=[],activeId='',categories=[],pending=null,imported=null,rankMode='amount',calendarDate=new Date(),chosenDate=new Date();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function read(){try{books=JSON.parse(localStorage.getItem(STORE)||'[]')}catch(e){books=[]}if(!Array.isArray(books))books=[];if(!books.length){let old=[];try{old=JSON.parse(localStorage.getItem(LEGACY)||'[]')}catch(e){}books=[{id:uid(),name:'我的账单',records:Array.isArray(old)?old:[],created:Date.now()}]}books.forEach(b=>{if(!Array.isArray(b.records))b.records=[]});activeId=books[0].id;try{categories=JSON.parse(localStorage.getItem(CAT)||'[]')}catch(e){categories=[]}if(!Array.isArray(categories))categories=[];['未分类','餐饮','交通','购物','居住','娱乐','医疗','学习','其他'].forEach(x=>{if(!categories.includes(x))categories.push(x)});books.forEach(b=>b.records.forEach(r=>{if(!r.category||!categories.includes(r.category))r.category='未分类'}));save();saveCats()}
function current(){return books.find(b=>b.id===activeId)||books[0]}
function save(){localStorage.setItem(STORE,JSON.stringify(books));if(current())localStorage.setItem(LEGACY,JSON.stringify(current().records))}
function saveCats(){localStorage.setItem(CAT,JSON.stringify(categories))}
function open(id){$(id).classList.add('open')}function close(id){$(id).classList.remove('open')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function moneyInput(n){return (n/100).toFixed(2)}
function renderCats(){let s=$('mCategory'),v=s.value;s.innerHTML='';categories.forEach(n=>{let o=document.createElement('option');o.value=n;o.textContent=n;s.append(o)});s.value=categories.includes(v)?v:'未分类';let list=$('categoryList');list.innerHTML='';categories.forEach(n=>{let row=document.createElement('div');row.className='categoryManageRow';let label=document.createElement('span');label.textContent=n;let action=document.createElement('span');if(n==='未分类'){action.className='systemTag';action.textContent='系统类别 · 不可删除'}else{let del=document.createElement('button');del.textContent='删除';del.disabled=books.some(b=>b.records.some(r=>r.category===n));del.title=del.disabled?'有账单记录使用此类别':'删除类别';del.onclick=()=>{categories=categories.filter(x=>x!==n);saveCats();renderCats()};action.append(del)}row.append(label,action);list.append(row)});syncCustom()}
function addCategory(){let n=$('newCategory').value.trim();if(!n)return;if(categories.includes(n)){showMessage('类别已存在');return}categories.push(n);saveCats();renderCats();$('mCategory').value=n;syncCustom();$('newCategory').value=''}
function showMessage(msg){$('confirmTitle').textContent='提示';$('confirmText').textContent=msg;$('confirmDelete').textContent='知道了';$('cancelDelete').style.display='none';pending={type:'message'};open('confirmModal')}
function renderBookSelect(){let s=$('bookSelect');s.innerHTML='';books.forEach(b=>{let o=document.createElement('option');o.value=b.id;o.textContent=b.name;s.append(o)});s.value=activeId;syncCustom();$('bookMeta').textContent='当前账单：'+current().name+' · '+current().records.length+' 笔记录'}
function filtered(){let p=$('mPeriod').value,sel=$('mPeriodKey'),records=current().records,keys=[...new Set(records.map(r=>periodKey(r,p)))].sort().reverse();let keep=sel.value;sel.innerHTML='';keys.forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=k;sel.append(o)});if(keys.includes(keep))sel.value=keep;sel.disabled=p==='all';syncCustom();return records.filter(r=>p==='all'||periodKey(r,p)===sel.value)}
function periodKey(r,p){let d=new Date(r.date),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');if(p==='day')return y+'-'+m+'-'+day;if(p==='month')return y+'-'+m;if(p==='year')return ''+y;if(p==='week'){let x=new Date(Date.UTC(y,d.getMonth(),d.getDate()));x.setUTCDate(x.getUTCDate()+4-(x.getUTCDay()||7));let yr=x.getUTCFullYear(),first=new Date(Date.UTC(yr,0,1));return yr+'-W'+String(Math.ceil((((x-first)/86400000)+1)/7)).padStart(2,'0')}return 'all'}
function render(){renderBookSelect();let rows=filtered(),total=rows.reduce((a,r)=>a+r.amount,0),cats={};rows.forEach(r=>cats[r.category||'未分类']=(cats[r.category||'未分类']||0)+r.amount);$('mTotal').textContent=fmt(total);$('mCatCount').textContent=Object.keys(cats).length+' 类';$('mCount').textContent=rows.length+' 笔';$('mTotalFoot').textContent=fmt(total);$('mCatCountFoot').textContent=Object.keys(cats).length+' 类';$('mCountFoot').textContent=rows.length+' 笔消费';let bars=$('mBars');bars.innerHTML='';Object.entries(cats).sort((a,b)=>b[1]-a[1]).forEach(([n,v])=>{let el=document.createElement('div');el.className='barrow';el.innerHTML='<span>'+esc(n)+'</span><div class="bartrack"><div class="barfill" style="width:'+(total?v/total*100:0)+'%"></div></div><b style="text-align:right">'+fmt(v)+'</b>';bars.append(el)});let sort=$('mSort').value;rows.sort((a,b)=>sort==='date'?b.date.localeCompare(a.date):sort==='old'?a.date.localeCompare(b.date):sort==='high'?b.amount-a.amount:sort==='low'?a.amount-b.amount:sort==='cat'?a.category.localeCompare(b.category,'zh-CN'):a.item.localeCompare(b.item,'zh-CN'));let list=$('mRecords');list.innerHTML='';if(!rows.length)list.innerHTML='<div class="empty">当前账单没有消费记录</div>';rows.forEach(r=>{let el=document.createElement('div');el.className='mRecord';el.innerHTML='<div><b class="itemName">'+esc(r.item)+'</b><small>'+esc(r.category||'未分类')+' · '+new Date(r.date).toLocaleString('zh-CN')+'</small></div><strong>'+fmt(r.amount)+'</strong><div class="itemTools"><button data-act="cat">分类</button><button data-act="del">删除</button></div>';el.querySelector('[data-act=cat]').onclick=()=>editCategory(r.id);el.querySelector('[data-act=del]').onclick=()=>confirmAction('delete',r.id,'删除这条消费记录？');list.append(el)});renderRanking(rows,cats)}
function renderRanking(rows,cats){let data=Object.entries(cats).map(([name,amount])=>({name,amount,count:rows.filter(r=>r.category===name).length}));let order=$('rankSort').value;data.sort((a,b)=>{let x=rankMode==='count'?a.count:a.amount,y=rankMode==='count'?b.count:b.amount;return order==='asc'?x-y:y-x});let box=$('rankContent');box.innerHTML='';data.forEach((r,i)=>{let row=document.createElement('div');row.className='rankRow';row.innerHTML='<span>'+(i+1)+'. '+esc(r.name)+'</span><b>'+(rankMode==='count'?r.count+' 笔':fmt(r.amount))+'</b>';box.append(row)});if(!data.length)box.textContent='暂无排行数据';$('rankType').textContent=(rankMode==='amount'?'按金额排行':'按次数排行')+'　⌄'}
let editingRecordId=null;function editCategory(id){let r=current().records.find(x=>x.id===id);if(!r)return;editingRecordId=id;let box=$('itemCategoryChoices');box.innerHTML='';categories.forEach(c=>{let b=document.createElement('button');b.type='button';b.className='custom-select-option';b.textContent=c+(r.category===c?'　✓':'');b.onclick=()=>{let target=current().records.find(x=>x.id===editingRecordId);if(target){target.category=c;save();render()}close('itemCategoryModal')};box.append(b)});open('itemCategoryModal')}
function confirmAction(type,id,msg){pending={type,id};$('confirmTitle').textContent='请确认';$('confirmText').textContent=msg;$('cancelDelete').style.display='';$('confirmDelete').textContent='确定';open('confirmModal')}
function finishConfirm(){if(!pending)return;if(pending.type==='delete'){current().records=current().records.filter(r=>r.id!==pending.id);save();close('confirmModal');pending=null;render()}else if(pending.type==='message'){close('confirmModal');pending=null;$('cancelDelete').style.display=''}else if(pending.type==='replace'){current().records=imported.records;current().name=imported.name;save();close('importModal');close('confirmModal');pending=null;render()}else if(pending.type==='new'){books.push({id:uid(),name:imported.name,records:imported.records,created:Date.now()});activeId=books[books.length-1].id;save();close('importModal');render()}}
function customSelect(sel){if(sel.dataset.enhanced)return;sel.dataset.enhanced='1';sel.classList.add('native-select');let wrap=document.createElement('div');wrap.className='custom-select';wrap.dataset.for=sel.id;let t=document.createElement('button');t.type='button';t.className='custom-select-trigger';let m=document.createElement('div');m.className='custom-select-menu';wrap.append(t,m);sel.insertAdjacentElement('afterend',wrap);function sync(){t.textContent=(sel.selectedOptions[0]?.textContent||'请选择')+'　⌄';m.innerHTML='';[...sel.options].forEach(o=>{let b=document.createElement('button');b.type='button';b.className='custom-select-option';b.textContent=o.textContent;b.onclick=()=>{sel.value=o.value;sel.dispatchEvent(new Event('change',{bubbles:true}));syncCustom();wrap.classList.remove('open')};m.append(b)});t.disabled=sel.disabled}t.onclick=()=>{document.querySelectorAll('.custom-select.open').forEach(x=>x.classList.remove('open'));wrap.classList.toggle('open')};sel.addEventListener('change',sync);wrap._sync=sync;sync()}
function syncCustom(){document.querySelectorAll('.custom-select').forEach(w=>{let s=$(w.dataset.for);if(s)w._sync()})}
function initCalendar(){let h=$('dateHour'),m=$('dateMinute');for(let i=0;i<24;i++){let o=document.createElement('option');o.value=i;o.textContent=String(i).padStart(2,'0');h.append(o)}for(let i=0;i<60;i++){let o=document.createElement('option');o.value=i;o.textContent=String(i).padStart(2,'0');m.append(o)}}
function drawCalendar(){let y=calendarDate.getFullYear(),mo=calendarDate.getMonth();$('calendarLabel').textContent=y+'年'+(mo+1)+'月';let first=new Date(y,mo,1),start=(first.getDay()+6)%7,days=new Date(y,mo+1,0).getDate(),grid=$('calendarGrid');grid.innerHTML='';['一','二','三','四','五','六','日'].forEach(x=>{let b=document.createElement('b');b.textContent=x;b.style.textAlign='center';grid.append(b)});for(let i=0;i<42;i++){let d=i-start+1,b=document.createElement('button');if(d<1||d>days){b.textContent='';b.disabled=true;b.className='mutedDay'}else{b.textContent=d;b.className=(chosenDate.getFullYear()===y&&chosenDate.getMonth()===mo&&chosenDate.getDate()===d)?'selected':'';b.onclick=()=>{chosenDate.setFullYear(y,mo,d);drawCalendar()}}grid.append(b)}}
function openDate(){let v=$('dateTrigger').dataset.iso?new Date($('dateTrigger').dataset.iso):new Date();chosenDate=v;calendarDate=new Date(v.getFullYear(),v.getMonth(),1);$('dateHour').value=v.getHours();$('dateMinute').value=v.getMinutes();drawCalendar();open('dateModal')}
function closeDate(){close('dateModal')}
function setDateLabel(){let iso=chosenDate.getFullYear()+'-'+String(chosenDate.getMonth()+1).padStart(2,'0')+'-'+String(chosenDate.getDate()).padStart(2,'0')+'T'+String($('dateHour').value).padStart(2,'0')+':'+String($('dateMinute').value).padStart(2,'0');$('dateTrigger').dataset.iso=iso;$('dateTrigger').textContent=chosenDate.toLocaleDateString('zh-CN')+' '+String($('dateHour').value).padStart(2,'0')+':'+String($('dateMinute').value).padStart(2,'0')}
function parseCSV(text){let rows=[],row=[],field='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}else if(c==='"')quoted=true;else if(c===','){row.push(field);field=''}else if(c==='\n'){row.push(field);rows.push(row);row=[];field=''}else if(c!=='\r')field+=c}if(field||row.length){row.push(field);rows.push(row)}return rows}
function normalize(arr){return arr.map(r=>{let dt=new Date(r.date||r.time||Date.now()),amount=Number.isSafeInteger(r.amount)?r.amount:cents(r.amount);return{id:uid(),category:categories.includes(String(r.category||'').trim())?String(r.category).trim():(String(r.category||'未分类').trim()||'未分类'),item:String(r.item||r.name||'未命名').trim(),amount,date:isNaN(dt.getTime())?'':dt.toISOString()}}).filter(r=>r.item&&r.date&&Number.isSafeInteger(r.amount)&&r.amount>0)}
